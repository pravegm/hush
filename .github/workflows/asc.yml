name: App Store Connect tool

# tools/appstore (README there). Copied from Brim's asc.yml (pravegm/brim, 26 Oct 2026) on 27 Oct 2026 and adapted for
# Hush: the HUSH-T log prefix, Hush's 12 badges, no final store run or header/search art yet (both defaults empty), and
# badges optional until ci.yml renders them (BADGES_REQUIRED below), so the tool can validate the listing from day one.
# Every push to the tool or the metadata: typecheck asc.swift and badges.swift, collect the 12 Game Center badges the
# app renders (from a green CI run's `screenshots` artifact, badges/), and validate docs/appstore/asc-metadata.json with
# the badges and the final store screenshots in place.
# App Store Connect is only contacted on a manual run with `asc` ticked AND the ASC_* secrets set. `mode` decides how
# far it goes: check (read-only), plan (check + dry run, read-only), push (check + plan + write). The key is written to
# a temp file for that job and deleted afterwards; it is never echoed. Inherited personal fields are masked.
# Header and search results art: none for Hush 1.0. Validated offline from DEFAULT_PLACEMENTS_RUN when one is set; sent
# to App Store Connect only when a manual run names placements_run (the placements step, opt-in).
on:
  push:
    branches: [main]
    paths:
      - "tools/appstore/**"
      - "docs/appstore/asc-metadata.json"
      - ".github/workflows/asc.yml"
  workflow_dispatch:
    inputs:
      asc:
        description: "Contact App Store Connect (needs secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_PRIVATE_KEY)"
        type: boolean
        default: false
      mode:
        description: "check = read-only status; plan = check + dry run (read-only); push = check + plan + write"
        type: choice
        options: [plan, check, push]
        default: plan
      only:
        description: "Optional step list, e.g. nomination or gamecenter,attach (empty = every step)"
        type: string
        default: ""
      store_run:
        description: "ID of a green 'App Store screenshots' run (empty = DEFAULT_STORE_RUN; none yet = screenshots skipped)"
        type: string
        default: ""
      ci_run:
        description: "ID of a green CI run whose screenshots/badges/ are the Game Center images (empty = latest green on main)"
        type: string
        default: ""
      placements_run:
        description: "ID of a store.yml run whose store-placements artifact (header + search art) to place (empty = leave them alone)"
        type: string
        default: ""
      inherit_from:
        description: "Bundle ID to read the copyright and App Review contact from at run time (empty = off)"
        type: string
        default: "com.pravegm.squish"
      build:
        description: "Release build number to attach to the version (step 'build', e.g. 13; empty = leave it)"
        type: string
        default: ""

env:
  # The final store frames. Empty until Hush has a signed-off App Store screenshots run (store.yml is still to be
  # ported from Brim/Swoop); put that run's ID here then, as Brim did (its final run was 40363198536).
  DEFAULT_STORE_RUN: ""
  # Signed-off header and search results art (Brim had run 40376904797). Hush 1.0 ships none, so empty.
  DEFAULT_PLACEMENTS_RUN: ""
  # "false" while the app can't render badges yet: a missing CI run or badges/ folder is then a warning, and validate
  # reports each badge as a gap (never pushed). Set to "true" once ci.yml renders the 12 badges (screen=badges), so a
  # lost badge turns the run red again, as on Brim.
  BADGES_REQUIRED: "false"

concurrency:
  group: asc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tool:
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcrun swift --version

      - name: Typecheck asc.swift and badges.swift
        run: |
          xcrun swiftc -typecheck tools/appstore/asc.swift
          xcrun swiftc -typecheck tools/appstore/badges.swift

      - name: Find the CI run with the app-rendered badges
        id: ci
        env:
          CI_RUN: ${{ inputs.ci_run }}
        run: |
          run="$CI_RUN"
          if [ -z "$run" ]; then
            run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status success -L 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          fi
          if [ -z "$run" ]; then
            if [ "$BADGES_REQUIRED" = "true" ]; then echo "::error::no green CI run found"; exit 1; fi
            echo "::warning::no green CI run found yet; badges skipped (BADGES_REQUIRED=false)"
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "Badges from CI run ${run:-none}"

      - name: Download its screenshots artifact (badges/ and logs/)
        if: steps.ci.outputs.run != ''
        run: |
          if ! gh run download "${{ steps.ci.outputs.run }}" -R "$GITHUB_REPOSITORY" -n screenshots -D "$RUNNER_TEMP/ci-shots"; then
            if [ "$BADGES_REQUIRED" = "true" ]; then echo "::error::no screenshots artifact in run ${{ steps.ci.outputs.run }}"; exit 1; fi
            echo "::warning::no screenshots artifact in run ${{ steps.ci.outputs.run }}; badges skipped"
          fi

      - name: Collect the badges (IDs checked against the app, flattened to opaque RGB)
        run: |
          mkdir -p tools/appstore/badges
          if [ -d "$RUNNER_TEMP/ci-shots/badges" ]; then
            grep -h "HUSH-T badges" "$RUNNER_TEMP"/ci-shots/logs/*badges*.txt 2>/dev/null || echo "::warning::no HUSH-T badges line in logs/*badges*.txt"
            xcrun swift tools/appstore/badges.swift --from "$RUNNER_TEMP/ci-shots/badges" --out tools/appstore/badges
          elif [ "$BADGES_REQUIRED" = "true" ]; then
            echo "::error::no badges/ folder in the CI screenshots artifact (ci.yml must run the screen=badges scenario)"; exit 1
          else
            echo "::warning::no badges rendered yet; validate will list them as gaps"
            # Still check the IDs (app vs achievements.md vs asc-metadata.json) once Hush/Core has them.
            if ls Hush/Core/*.swift >/dev/null 2>&1; then xcrun swift tools/appstore/badges.swift || echo "::warning::achievement IDs not checkable yet"; fi
          fi

      - name: Self-test the validator on the fixture
        run: |
          xcrun swift tools/appstore/asc.swift help
          xcrun swift tools/appstore/asc.swift validate --metadata tools/appstore/fixtures/asc-metadata.sample.json --inherit-from com.pravegm.squish

      - name: Upload badges
        uses: actions/upload-artifact@v4
        with:
          name: badges
          path: tools/appstore/badges/*.png
          if-no-files-found: ${{ env.BADGES_REQUIRED == 'true' && 'error' || 'warn' }}

  validate:
    # Separate job so a problem in the listing data shows up red without hiding the badges.
    needs: tool
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app
      - name: Badges from this run
        uses: actions/download-artifact@v4
        continue-on-error: ${{ env.BADGES_REQUIRED != 'true' }}
        with:
          name: badges
          path: tools/appstore/badges
      - name: Store screenshots
        env:
          STORE_RUN: ${{ inputs.store_run }}
        run: |
          run="${STORE_RUN:-$DEFAULT_STORE_RUN}"
          if [ -z "$run" ]; then
            echo "::warning::no App Store screenshots run yet; validate lists the screenshots as gaps"
          else
            for name in store-69 store-61 store-duo; do
              gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$name" -D "$RUNNER_TEMP/store/$name" || echo "::warning::artifact $name not found in run $run"
            done
          fi
          echo "ASC_SCREENSHOTS_DIR=$RUNNER_TEMP/store" >> "$GITHUB_ENV"
      - name: Header and search results art
        env:
          PLACEMENTS_RUN: ${{ inputs.placements_run }}
        run: |
          run="${PLACEMENTS_RUN:-$DEFAULT_PLACEMENTS_RUN}"
          if [ -z "$run" ]; then
            echo "No header/search art for Hush 1.0 (DEFAULT_PLACEMENTS_RUN empty)"
          elif gh run download "$run" -R "$GITHUB_REPOSITORY" -n store-placements -D "$RUNNER_TEMP/placements"; then
            echo "ASC_PLACEMENTS_DIR=$RUNNER_TEMP/placements" >> "$GITHUB_ENV"
          else
            echo "::warning::artifact store-placements not found in run $run"
          fi
      - name: Validate docs/appstore/asc-metadata.json
        run: xcrun swift tools/appstore/asc.swift validate --inherit-from com.pravegm.squish

  asc:
    needs: [tool, validate]
    if: github.event_name == 'workflow_dispatch' && inputs.asc
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      ASC_INHERIT_FROM: ${{ inputs.inherit_from }}
      ASC_BUILD: ${{ inputs.build }}
      MODE: ${{ inputs.mode }}
      ONLY: ${{ inputs.only }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the secrets exist
        id: secrets
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_PRIVATE_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_PRIVATE_KEY are not all set; nothing contacted (tools/appstore/README.md)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'

      - name: Select Xcode 27.1
        if: steps.secrets.outputs.ok == 'true'
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - name: Badges from this run
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/download-artifact@v4
        continue-on-error: ${{ env.BADGES_REQUIRED != 'true' }}
        with:
          name: badges
          path: tools/appstore/badges

      - name: Store screenshots
        if: steps.secrets.outputs.ok == 'true'
        env:
          STORE_RUN: ${{ inputs.store_run }}
        run: |
          run="${STORE_RUN:-$DEFAULT_STORE_RUN}"
          if [ -z "$run" ]; then
            echo "::warning::no App Store screenshots run yet; the screenshots step changes nothing"
          else
            echo "Screenshots from store run $run"
            for name in store-69 store-61 store-duo; do
              gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$name" -D "$RUNNER_TEMP/store/$name" || echo "::warning::artifact $name not found in run $run"
            done
          fi
          echo "ASC_SCREENSHOTS_DIR=$RUNNER_TEMP/store" >> "$GITHUB_ENV"

      - name: Header and search results art (only when placements_run is given)
        if: steps.secrets.outputs.ok == 'true' && inputs.placements_run != ''
        env:
          PLACEMENTS_RUN: ${{ inputs.placements_run }}
        run: |
          echo "Header and search art from store run $PLACEMENTS_RUN"
          gh run download "$PLACEMENTS_RUN" -R "$GITHUB_REPOSITORY" -n store-placements -D "$RUNNER_TEMP/placements"
          echo "ASC_PLACEMENTS_DIR=$RUNNER_TEMP/placements" >> "$GITHUB_ENV"

      - name: Write the API key to a temp file
        if: steps.secrets.outputs.ok == 'true'
        run: |
          umask 077
          # Accept the .p8 pasted as-is, or with literal \n sequences.
          printf '%s\n' "$ASC_PRIVATE_KEY" | sed 's/\\n/\n/g' > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"

      - name: check (read-only)
        if: steps.secrets.outputs.ok == 'true'
        run: ASC_OUTPUT_FILE="$RUNNER_TEMP/out/check.txt" xcrun swift tools/appstore/asc.swift check

      - name: plan (dry run, read-only)
        if: steps.secrets.outputs.ok == 'true' && (inputs.mode == 'plan' || inputs.mode == 'push')
        run: |
          if [ -n "$ONLY" ]; then set -- --only "$ONLY"; fi
          ASC_OUTPUT_FILE="$RUNNER_TEMP/out/plan.txt" xcrun swift tools/appstore/asc.swift plan "$@"

      - name: push (writes to App Store Connect)
        if: steps.secrets.outputs.ok == 'true' && inputs.mode == 'push'
        run: |
          if [ -n "$ONLY" ]; then set -- --only "$ONLY"; fi
          ASC_OUTPUT_FILE="$RUNNER_TEMP/out/push.txt" xcrun swift tools/appstore/asc.swift push "$@"

      - name: Delete the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

      # ASC_OUTPUT_FILE receives the tool's masked lines only (never the ::add-mask:: commands): no personal data.
      - name: Upload the check/plan/push output
        if: always() && steps.secrets.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: asc-output
          path: ${{ runner.temp }}/out/*.txt
          if-no-files-found: ignore
