name: Duo

# Runs Hush on a real iPhone Duo simulator (iOS 27.1 runtime, ~7.85 GB download; the runner image ships only 27.0,
# which has no Duo) and drives the hinge with the community `hinge` CLI (artemnovichkov/hinge, Device Hub's private
# HID event posted inside the simulator). The app asks for portrait itself (demo key orient=portrait, Brim's proven
# route: there is no CLI rotate and `simctl io … screenConfig` crash-loops SpringBoard), giving the tabletop canvas.
# Script: ci/duo.sh. Hinge checks (design/ROUND-1.md, ROUND-2.md, ROUND-3.md): SLOW-OPEN, STILL, SLAM (shot on the
# bite), SLAM-CREAK (R3: an attract slam shot on the CREAK accent), UPRIGHT-NO-PAUSE, CLOSE-PAUSE (70°),
# REOPEN-NO-BITE, COVER-SLOW-CLOSE and COVER-SLOW-REOPEN (R3: the cover display is always a pause), FLAT-OPEN,
# WATCHDOG and LANDSCAPE-PLAY (R6: never stuck when opened flat or left in landscape) (+ PORTRAIT, POSE-CARD), printed
# as "<CHECK> PASS|FAIL|INCONCLUSIVE (…)" in logs/run.txt and as a table in the job summary. R6: the landscape drag
# XCUITest also runs here, on the real Duo landscape (non-fatal, input `uitest`). Frames: closed 105,
# half 135, wide 160, cover shut, reopened, and UI frames incl. the held book-pose card (pose=book). The App Store Duo
# set is store.yml's (PASSES=store). Manual only (expensive: ~50–80 macOS minutes).
on:
  workflow_dispatch:
    inputs:
      passes:
        description: "Passes: hinge (the 12 checks), frames (105/135/160/cover), ui (home, lesson, results, codex, settings, book-pose card, cover); store = the App Store Duo set"
        type: string
        default: "hinge frames ui"
      orient:
        description: "Demo key appended to tabletop launches as orient=<value> (empty = none; the sim then stays in book pose)"
        type: string
        default: "portrait"
      strict:
        description: "Fail the job when a hinge check FAILs (default: report only)"
        type: boolean
        default: false
      uitest:
        description: "R6: also run the landscape drag XCUITest on the Duo (non-fatal, ~10-15 min)"
        type: boolean
        default: true

concurrency:
  group: duo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duo:
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      XCODE_APP: /Applications/Xcode_27.1.app
      RUNTIME_ID: com.apple.CoreSimulator.SimRuntime.iOS-27-1
      DUO_TYPE_FALLBACK: com.apple.CoreSimulator.SimDeviceType.iPhone-Duo
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27.1
        timeout-minutes: 8
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          xcrun simctl list runtimes
          command -v gtimeout >/dev/null || brew install coreutils

      - name: Install the iOS 27.1 runtime
        timeout-minutes: 30
        run: |
          installed() {
            xcrun simctl list runtimes -j | python3 -c "import json,sys,os; sys.exit(0 if any(r['identifier']==os.environ['RUNTIME_ID'] and r.get('isAvailable') for r in json.load(sys.stdin)['runtimes']) else 1)"
          }
          if installed; then echo "already installed"; exit 0; fi
          # Squish DUO-CI: the first download can fail with DVTDownloadableErrorDomain Code=41; a retry works.
          for attempt in 1 2 3; do
            gtimeout 1500 xcodebuild -downloadPlatform iOS 2>&1 | grep -v "Downloading iOS" | tail -20 || true
            installed && break
            sleep 15
          done
          installed || { echo "::error::iOS 27.1 runtime not installed"; exit 1; }

      - name: Create and boot the iPhone Duo
        id: sim
        timeout-minutes: 10
        run: |
          type=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; print(next((d['identifier'] for d in json.load(sys.stdin)['devicetypes'] if d['name']=='iPhone Duo'), ''))")
          type="${type:-$DUO_TYPE_FALLBACK}"
          udid=$(xcrun simctl create "Hush Duo" "$type" "$RUNTIME_ID")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          # Boot now so the (slow) first boot overlaps the hinge install and the build.
          xcrun simctl boot "$udid"

      - name: Install the hinge tool
        timeout-minutes: 25
        run: |
          # Store run 40268420280 (Swoop): one brew install timed out, the Duo stayed shut and every frame was the
          # cover display. Retry, and stop here if it never installs (nothing below means anything without it).
          for attempt in 1 2 3; do
            gtimeout 420 brew install artemnovichkov/tap/hinge && break
            echo "::warning::hinge install attempt $attempt failed"; sleep 10
          done
          command -v hinge >/dev/null || { echo "::error::hinge tool unavailable: the Duo cannot be opened"; exit 1; }

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the Duo
        timeout-minutes: 30
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          gtimeout 1700 xcodebuild build -project Hush.xcodeproj -scheme Hush -destination "id=$UDID" \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|\*\* " || true
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log

      - name: Wait for boot, warm up the hinge helper
        timeout-minutes: 15
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          gtimeout 840 xcrun simctl bootstatus "$UDID" -b
          # The first `hinge` call compiles and installs its in-simulator helper; do it here, outside the timed checks.
          if command -v hinge >/dev/null; then gtimeout 120 hinge -d "$UDID" get || true; fi
          # The display names (LCD/LCD-1 or primary/primary-1) for the record; ci/duo.sh probes them itself.
          gtimeout 30 xcrun simctl io "$UDID" enumerate || true

      - name: Capture
        timeout-minutes: 90
        env:
          UDID: ${{ steps.sim.outputs.udid }}
          PASSES: ${{ inputs.passes }}
          ORIENT: ${{ inputs.orient }}
          STRICT: ${{ inputs.strict && '1' || '0' }}
          OUT: duo-screens
        run: bash ci/duo.sh

      - name: Landscape drag on the Duo (UI test, non-fatal)
        # R6 (ROUND-6 CI 1): HushUITests' testLandscapeTurnedDragBagsALitItem on the real Duo, where a landscape
        # interface is what iOS really does (ci.yml runs it on a phone sim, where only `quarter=3` can force k = 3).
        # XCUIDevice .landscapeRight (= interface .landscapeLeft, k = 3) + `orient=landscape;quarter=3`, `lid=0.9` so no
        # hinge is needed (it is set to 150 anyway, so the inner display is lit). Runs after the capture so it can't
        # disturb ci/duo.sh. Ad-hoc signature retry as in ci.yml. Verdict in the summary; xcresult in duo-screens/.
        if: ${{ !cancelled() && inputs.uitest }}
        continue-on-error: true
        timeout-minutes: 30
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set +e
          command -v hinge >/dev/null && gtimeout 20 hinge -d "$UDID" -t 3 150
          T=HushUITests/TurnedDragUITests/testLandscapeTurnedDragBagsALitItem
          T2=HushUITests/TurnedDragUITests/testLandscapeCarryOnTapsAtOddK
          # R9 control (design/notes/fix-k3-drag.md): the k=2 drag on the Duo. If it ALSO bags nothing, the Duo sim's
          # synthesized touches are the problem, not the quarter turn.
          T3=HushUITests/TurnedDragUITests/testTurnedDragBagsALitItem
          mkdir -p duo-screens
          run_ui() {
            gtimeout 1500 xcodebuild test -project Hush.xcodeproj -scheme HushUITests -destination "id=$UDID" \
              -derivedDataPath build -only-testing:"$T" -only-testing:"$T2" -only-testing:"$T3" \
              -resultBundlePath "duo-screens/uitest-$1.xcresult" "${@:2}" \
              > "duo-screens/uitest-$1.log" 2>&1
            grep -E "error:|Test [Cc]ase .*(passed|failed|skipped)|XCTSkip|Executed|\*\* TEST" "duo-screens/uitest-$1.log" | tail -30
          }
          run_ui unsigned CODE_SIGNING_ALLOWED=NO
          LOG=duo-screens/uitest-unsigned.log
          if ! grep -qE "Test [Cc]ase .*(passed|failed|skipped)" "$LOG"; then
            echo "::warning::UI test did not run unsigned; retrying with an ad-hoc signature"
            run_ui adhoc CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO
            LOG=duo-screens/uitest-adhoc.log
          fi
          if grep -qE "Test [Cc]ase .*testLandscapeTurnedDragBagsALitItem.* passed" "$LOG"; then
            v="**PASS**: a real drag through the landscape (k = 3) layout bagged the item."
          elif grep -qE "Test [Cc]ase .*testLandscapeTurnedDragBagsALitItem.* skipped" "$LOG"; then
            v="SKIPPED: $(grep -m1 -oE "(No \`[a-z.]+\` accessibility element[^:]*|Landscape drag: the layout is k=[0-9]+[^(]*)" "$LOG" || echo 'see the log')."
            echo "::warning::Landscape drag UI test skipped on the Duo"
          elif grep -qE "Test [Cc]ase .*testLandscapeTurnedDragBagsALitItem.* failed" "$LOG"; then
            v="**FAIL**: $(grep -m1 -oE "Landscape turned drag from[^(]*" "$LOG" || echo 'see the log')"
            echo "::warning::Landscape drag UI test FAILED on the Duo: the k = 3 touch mapping may be wrong"
          else
            v="did not run (see $LOG)."
            echo "::warning::Landscape drag UI test did not run on the Duo"
          fi
          {
            echo "### Landscape drag on the Duo (HushUITests)"
            echo ""
            echo "$v Attachments (screenshots, drag and canvas text) in \`duo-screens/uitest-*.xcresult\`."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duo-screens
          path: |
            duo-screens/
            build.log
          if-no-files-found: ignore

      - name: Shut down
        if: always()
        continue-on-error: true
        run: xcrun simctl shutdown all || true
