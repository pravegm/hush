name: CI

# Our only compiler: builds Hush with Xcode 27.1, runs the unit tests on an iPhone 18 Pro simulator, then captures
# portrait demo-mode screenshots (ci/scenarios.txt via ci/screenshots.sh) and renders the app icon.
# Adapted from Swoop's ci.yml (proven on these runners). Artifacts: `logs` (build.log, errors.txt) and `screenshots`
# (ci-screens/: <scenario>.png, logs/, captures.tsv, device.txt, app-icon-1024.png).
on:
  push:
    branches: [main]
    paths:
      - "Hush/**"
      - "HushTests/**"
      - "HushUITests/**"
      - "project.yml"
      - "ci/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
    inputs:
      filter:
        description: "Regex of scenario names to capture (ci/scenarios.txt), e.g. '^1[0-6]-' or 'fold'"
        type: string
        default: "."

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      DEVICE: "iPhone 18 Pro"
      # Balance harness seeds per skill (HushTests/BalanceTests.swift); xcodebuild passes TEST_RUNNER_* to the test
      # process with the prefix stripped (the test reads HUSH_BAL_SEEDS).
      TEST_RUNNER_HUSH_BAL_SEEDS: "8"
    steps:
      - uses: actions/checkout@v4

      - name: Store copy says candle, not torch (warning only)
        # R3 (QA-2 P1-2, ROUND-3 "Launch lead"): the game's light is a candle. Any "torch" left in the store, site or
        # App Store Connect text is a warning annotated at its line, never a failure. Whole words only, any case, so
        # code names such as the `torchLow` freeze tag don't count. Runs first, so a failed build still reports it.
        # (docs-only pushes don't trigger this workflow; run it by hand, or it runs on the next code push.)
        if: always()
        continue-on-error: true
        run: |
          set +e
          shopt -s nullglob
          files=(docs/appstore/*.md docs/*.html docs/appstore/asc-metadata.json)
          if (( ${#files[@]} == 0 )); then echo "no store docs found"; exit 0; fi
          hits=$(grep -n -i -w -E "torch(es)?" "${files[@]}" 2>/dev/null)
          if [ -z "$hits" ]; then
            echo "No \"torch\" in ${#files[@]} store/site files."
            echo "Store copy: no \"torch\" in ${#files[@]} files." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          n=$(printf '%s\n' "$hits" | wc -l | tr -d ' ')
          printf '%s\n' "$hits" | head -50 | while IFS=: read -r f l text; do
            echo "::warning file=$f,line=$l::\"torch\" in store copy (the app says candle): $(printf '%s' "$text" | cut -c1-160)"
          done
          {
            echo "### Store copy: $n line(s) still say \"torch\" (the app says candle)"
            echo '```'
            printf '%s\n' "$hits" | cut -c1-200 | head -50
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s /Applications/Xcode_27.1.app
          xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Hush.xcodeproj -scheme Hush \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|warning: .*Hush/|Test run|Suite .* (passed|failed)|✘|HUSH-BAL|\*\* " || true
          grep -q "\*\* TEST SUCCEEDED \*\*" build.log

      - name: Summarise errors
        if: failure()
        run: |
          grep -E "error:|✘|failed" build.log | sort -u | head -300 > errors.txt || true
          cat errors.txt

      - name: Balance table
        if: always()
        continue-on-error: true
        run: |
          [ -f build.log ] || exit 0
          if grep -q "HUSH-BAL" build.log; then
            {
              echo "### Balance (HUSH-BAL, $TEST_RUNNER_HUSH_BAL_SEEDS seeds per skill)"
              echo '```'
              grep -oE "HUSH-BAL.*" build.log | awk '!seen[$0]++' | head -80
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Demo-guard positive control
        # testflight.yml fails a Release binary that contains "HUSH-T paused closing" (a DEBUG-only log literal) or the
        # key "freezeAfter". That guard only means something if the literal is visible to `strings` in a Debug build
        # (Xcode puts Debug code in Hush.debug.dylib), so check it here. Non-fatal.
        if: success()
        continue-on-error: true
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/Hush.app
          if strings "$APP/Hush" "$APP"/*.debug.dylib 2>/dev/null | grep -q "HUSH-T paused closing"; then
            echo "The Debug binary carries the HUSH-T paused closing literal: the Release demo guard is live."
          else
            echo "::warning::No HUSH-T paused closing literal in the Debug build, so the demo-strings guard in testflight.yml cannot fire. Pick another long DEBUG-only literal for it."
          fi
          if strings "$APP/Hush" "$APP"/*.debug.dylib 2>/dev/null | grep -qx "freezeAfter"; then echo "freezeAfter is visible to strings in Debug."; else echo "freezeAfter is not visible to strings (Swift small string): expected."; fi

      - name: App icon check (warning only)
        # The same guard testflight.yml enforces (placeholder hash, 1024 x 1024, >= 40 colours, alpha), early.
        if: always()
        continue-on-error: true
        env:
          WARN_ONLY: "1"
        run: bash ci/icon-check.sh

      - name: App icon is RGB, no alpha (fatal)
        # QA-3 P2-10: the committed AppIcon-1024.png is RGB (colour type 2) since R3, so an alpha channel is now a
        # regression (ITMS-90717), not a warning. testflight.yml still flattens one for its own build (FIX_ALPHA=1).
        run: bash ci/icon-check.sh --alpha-only

      - name: Capture screenshots
        if: success()
        timeout-minutes: 100
        env:
          SCENARIO_FILTER: ${{ inputs.filter || '.' }}
        run: bash ci/screenshots.sh

      - name: Render the app icon
        # Non-fatal. The App engineer's `-hushDemo "screen=icon"` renders UI/AppIconArt.swift to a 1024 PNG and prints
        # `HUSH-ICON <absolute path>` (a path in the sim's data container, which is a host path, so it is copied
        # directly). HUSH_ICON=1 is also passed (SIMCTL_CHILD_ → the app's environment) for an app that keys off it.
        # Fallbacks: Swoop's Documents/AppIcon-1024.png, then any *icon*.png in the app's Documents.
        if: success()
        continue-on-error: true
        timeout-minutes: 6
        run: |
          set +e   # the default step shell is bash -e; every miss here is a warning, not a stop
          set -uo pipefail
          OUT="$PWD/ci-screens"; mkdir -p "$OUT/logs"
          UDID=$(awk -F= '$1=="udid" {print $2}' "$OUT/device.txt" 2>/dev/null)
          UDID="${UDID:-booted}"
          LOG="$OUT/logs/icon.txt"; : > "$LOG"
          to() { local s="$1"; shift; if command -v gtimeout >/dev/null 2>&1; then gtimeout -k 5 "$s" "$@"; elif command -v timeout >/dev/null 2>&1; then timeout -k 5 "$s" "$@"; else "$@"; fi; }
          export SIMCTL_CHILD_HUSH_ICON=1
          to 30 xcrun simctl terminate "$UDID" com.pravegm.hush 2>/dev/null || true
          to 90 xcrun simctl launch --terminate-running-process \
            --stdout="$LOG" --stderr="$LOG" "$UDID" com.pravegm.hush -hushDemo "screen=icon" >/dev/null \
            || echo "::warning::icon launch failed"
          src=""
          for i in $(seq 1 40); do
            src=$(grep -m1 -oE "HUSH-ICON .+" "$LOG" 2>/dev/null | sed -E 's/^HUSH-ICON +//; s/[[:space:]]+$//')
            [ -n "$src" ] && [ -f "$src" ] && break
            sleep 1
          done
          if [ -z "$src" ] || [ ! -f "$src" ]; then
            data=$(to 30 xcrun simctl get_app_container "$UDID" com.pravegm.hush data 2>/dev/null || true)
            if [ -n "$data" ] && [ -f "$data/Documents/AppIcon-1024.png" ]; then src="$data/Documents/AppIcon-1024.png"
            elif [ -n "$data" ]; then src=$(ls "$data"/Documents/*[Ii]con*.png 2>/dev/null | head -1); fi
          fi
          to 30 xcrun simctl terminate "$UDID" com.pravegm.hush 2>/dev/null || true
          grep -E "HUSH-" "$LOG" | tail -5 || true
          if [ -n "$src" ] && [ -f "$src" ]; then
            cp "$src" "$OUT/app-icon-1024.png"
            dims=$(sips -g pixelWidth -g pixelHeight "$OUT/app-icon-1024.png" 2>/dev/null | awk '/pixel/ {printf "%s ", $2}')
            alpha=$(sips -g hasAlpha "$OUT/app-icon-1024.png" 2>/dev/null | awk '/hasAlpha/ {print $2}')
            echo "app icon: $src -> app-icon-1024.png ($dims, hasAlpha=$alpha)"
            [ "$dims" = "1024 1024 " ] || echo "::warning::app icon is $dims, not 1024 x 1024"
            [ "$alpha" = "no" ] || echo "::warning::app icon has an alpha channel (App Store icons must not)"
            echo "App icon rendered: \`app-icon-1024.png\` ($dims, hasAlpha=$alpha) in the screenshots artifact." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::no app icon PNG (no HUSH-ICON line and nothing in Documents)"
            echo "App icon: **not rendered** (no \`HUSH-ICON\` line; see ci-screens/logs/icon.txt)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Turned drag (UI test, non-fatal)
        # R2 (REVIEW-1-duo P1-3): HushUITests/TurnedDragUITests.swift drags a real synthesized finger from where a lit
        # item is drawn to where the pouch is drawn, on the turned Duo layout (fold=1, turn=1), and reads the pouch's
        # in-bag count (accessibility `hud.bag`). Its own scheme, so the gate above never runs it. It SKIPS until the App
        # exposes `hud.bag` and `debug.loot` (design/NEEDS.md). Non-fatal for now: a FAIL here is a warning.
        # If the runner app won't load unsigned (CODE_SIGNING_ALLOWED=NO), it retries once with an ad-hoc signature.
        if: success()
        continue-on-error: true
        timeout-minutes: 25
        run: |
          set +e
          UDID=$(awk -F= '$1=="udid" {print $2}' ci-screens/device.txt 2>/dev/null)
          if [ -n "$UDID" ]; then DEST="id=$UDID"; else DEST="platform=iOS Simulator,name=$DEVICE"; fi
          run_ui() {
            xcodebuild test -project Hush.xcodeproj -scheme HushUITests -destination "$DEST" \
              -derivedDataPath build -resultBundlePath "uitest-$1.xcresult" "${@:2}" > "uitest-$1.log" 2>&1
            grep -E "error:|Test [Cc]ase .*(passed|failed|skipped)|XCTSkip|Executed|\*\* TEST" "uitest-$1.log" | tail -30
          }
          run_ui unsigned CODE_SIGNING_ALLOWED=NO
          LOG=uitest-unsigned.log
          if ! grep -qE "Test [Cc]ase .*(passed|failed|skipped)" uitest-unsigned.log; then
            echo "::warning::UI test did not run unsigned; retrying with an ad-hoc signature"
            run_ui adhoc CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO
            LOG=uitest-adhoc.log
          fi
          cp "$LOG" uitest.log
          if grep -qE "Test [Cc]ase .*testTurnedDragBagsALitItem.* passed" "$LOG"; then
            verdict="**PASS**: a real drag through the turned SpriteView bagged the item."
          elif grep -qE "Test [Cc]ase .*testTurnedDragBagsALitItem.* skipped" "$LOG"; then
            verdict="SKIPPED: $(grep -m1 -oE "No \`[a-z.]+\` accessibility element[^:]*" "$LOG" || echo 'see uitest.log')."
            echo "::warning::Turned-drag UI test skipped (App accessibility hooks missing, design/NEEDS.md)"
          elif grep -qE "Test [Cc]ase .*testTurnedDragBagsALitItem.* failed" "$LOG"; then
            verdict="**FAIL**: $(grep -m1 -oE "Turned drag from[^(]*" "$LOG" || echo 'see uitest.log')"
            echo "::warning::Turned-drag UI test FAILED: the turned touch mapping may be mirrored (REVIEW-1-duo P1-3)"
          else
            verdict="did not run (see uitest.log)."
            echo "::warning::Turned-drag UI test did not run"
          fi
          echo "### Turned drag (HushUITests)" >> "$GITHUB_STEP_SUMMARY"
          echo "$verdict Screenshots are attachments in \`uitest-*.xcresult\` (logs artifact)." >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: |
            build.log
            errors.txt
            uitest.log
            uitest-*.log
            uitest-*.xcresult
          if-no-files-found: ignore

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ci-screens/
          if-no-files-found: ignore
