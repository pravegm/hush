# XcodeGen spec. Generate the Xcode project on a Mac with:
#   brew install xcodegen && xcodegen generate
name: Hush
options:
  bundleIdPrefix: com.pravegm
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # set in Xcode > Signing & Capabilities, or by testflight.yml
targets:
  Hush:
    type: application
    platform: iOS
    sources:
      - path: Hush
    info:
      path: Hush/Info.plist
      properties:
        CFBundleDisplayName: Hush
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Play is portrait: the Duo stands in tabletop pose (lid up). Landscape is listed so a Duo held like a book is
        # never letterboxed; it shows the pose card. Upside down is NOT listed: full-screen apps are refused it anyway
        # (Brim real-Duo build 11), so RootView draws the canvas turned round itself (the blurred-half rule).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UIViewControllerBasedStatusBarAppearance: false
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
        GKGameCenterBadgingDisabled: true
    entitlements:
      path: Hush/Hush.entitlements
      properties:
        com.apple.developer.game-center: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pravegm.hush
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
  HushTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HushTests
    dependencies:
      - target: Hush
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  # R2 (CI engineer): one XCUITest, a real synthesized finger drag through the turned SpriteView
  # (HushUITests/TurnedDragUITests.swift). It has its OWN scheme so `xcodebuild test -scheme Hush` (the CI gate) and the
  # Release archive never build or run it; ci.yml runs it as a separate, non-fatal step.
  HushUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: HushUITests
    dependencies:
      - target: Hush
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.pravegm.hush.uitests
        TEST_TARGET_NAME: Hush
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Hush:
    build:
      targets:
        Hush: all
        HushTests: [test]
    test:
      targets:
        - HushTests
  HushUITests:
    build:
      targets:
        Hush: all
        HushUITests: [test]
    test:
      targets:
        - HushUITests
